<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS squircle -->
  <path d="M 512 64 C 862 64 960 162 960 512 C 960 862 862 960 512 960 C 162 960 64 862 64 512 C 64 162 162 64 512 64 Z" fill="url(#bg)"/>
  <!-- subtle highlight -->
  <path d="M 512 64 C 862 64 960 162 960 512 C 960 862 862 960 512 960 C 162 960 64 862 64 512 C 64 162 162 64 512 64 Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
  <!-- browser ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="44" filter="url(#shadow)"/>
  <!-- tick marks like a compass bezel -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round">
    <line x1="512" y1="168" x2="512" y2="208"/>
    <line x1="512" y1="816" x2="512" y2="856"/>
    <line x1="168" y1="512" x2="208" y2="512"/>
    <line x1="816" y1="512" x2="856" y2="512"/>
  </g>
  <!-- terminal prompt chevron: Claude Code at the helm -->
  <path d="M 392 352 L 592 512 L 392 672" fill="none" stroke="#ffffff" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- cursor underscore -->
  <rect x="612" y="600" width="130" height="72" rx="20" fill="#fbbf24" filter="url(#shadow)"/>
</svg>
